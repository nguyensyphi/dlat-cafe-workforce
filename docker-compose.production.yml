services:
  postgres:
    image: postgres:17-alpine
    container_name: dlat_postgres_prod
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: ${POSTGRES_USER:-cafe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafe_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cafe_workforce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cafe_admin} -d ${POSTGRES_DB:-cafe_workforce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dlat_workforce_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-cafe_admin}:${POSTGRES_PASSWORD:-cafe_secret_2026}@postgres:5432/${POSTGRES_DB:-cafe_workforce}?schema=public
      ENABLE_IN_PROCESS_CRON: ${ENABLE_IN_PROCESS_CRON:-true}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  # Automated daily PostgreSQL backup at 03:00 Asia/Ho_Chi_Minh, retaining 14 latest backups
  db-backup:
    image: postgres:17-alpine
    container_name: dlat_postgres_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-cafe_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cafe_secret_2026}
      PGDATABASE: ${POSTGRES_DB:-cafe_workforce}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache tzdata >/dev/null 2>&1 || true
        cat <<'EOF' > /usr/local/bin/run-backup.sh
        #!/bin/sh
        set -eu
        TS=$$(date +%Y%m%d_%H%M%S)
        OUT="/backups/dlat_cafe_$${TS}.sql.gz"
        echo "[$$(date -Iseconds)] Starting PostgreSQL backup -> $${OUT}"
        pg_dump --clean --if-exists --no-owner --no-privileges | gzip -9 > "$${OUT}"
        if [ ! -s "$${OUT}" ]; then
          echo "[$$(date -Iseconds)] ERROR: Backup file is empty!" >&2
          rm -f "$${OUT}"
          exit 1
        fi
        find /backups -type f -name 'dlat_cafe_*.sql.gz' -mtime +$${BACKUP_RETENTION_DAYS:-14} -delete
        echo "[$$(date -Iseconds)] Backup completed successfully ($$(du -h "$${OUT}" | cut -f1))."
        EOF
        chmod +x /usr/local/bin/run-backup.sh
        echo "0 3 * * * /usr/local/bin/run-backup.sh >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "[$$(date -Iseconds)] db-backup sidecar active: daily 03:00 Asia/Ho_Chi_Minh (retention $${BACKUP_RETENTION_DAYS:-14} days)"
        exec crond -f -l 8

  # Profile 1 (Cafe PC / Mini-PC behind NAT): Cloudflare Tunnel HTTPS without port forwarding
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dlat_cloudflared_tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  # Profile 2 (Cloud VPS with Public IP + Domain): Automatic Let's Encrypt HTTPS via Caddy
  caddy:
    image: caddy:2-alpine
    container_name: dlat_caddy_ssl
    restart: unless-stopped
    profiles: ["vps"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
    name: dlat_postgres_production_data
  caddy_data:
    name: dlat_caddy_data
  caddy_config:
    name: dlat_caddy_config
